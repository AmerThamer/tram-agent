syntax = "proto2";

// A generált osztályok csomagneve/név
package transit_realtime;
option java_package = "com.google.transit.realtime";
option java_outer_classname = "GtfsRealtime";

// ---- Alap feed szerkezet ----------------------------------------------------

message FeedMessage {
  required FeedHeader header = 1;
  repeated FeedEntity entity = 2;
}

message FeedHeader {
  // Pl. "2.0"
  required string gtfs_realtime_version = 1;

  enum Incrementality {
    FULL_DATASET = 0;
    DIFFERENTIAL = 1;
  }
  optional Incrementality incrementality = 2 [default = FULL_DATASET];

  // Epoch seconds
  optional uint64 timestamp = 3;
}

message FeedEntity {
  required string id = 1;
  optional bool is_deleted = 2 [default = false];

  // A három fő üzenettípus közül bármelyik.
  optional TripUpdate trip_update = 3;
  optional VehiclePosition vehicle = 4;
  optional Alert alert = 5;
}

// ---- Időintervallum, pozíció, fordítások -----------------------------------

message TimeRange {
  optional uint64 start = 1; // epoch sec
  optional uint64 end   = 2; // epoch sec
}

message Position {
  optional float latitude  = 1;
  optional float longitude = 2;
  optional float bearing   = 3;
  optional double odometer = 4;
  optional float speed     = 5;
}

message TranslatedString {
  message Translation {
    required string text = 1;
    optional string language = 2; // pl. "hu", "en"
  }
  repeated Translation translation = 1;
}

// ---- Trip és jármű leírók ---------------------------------------------------

message TripDescriptor {
  optional string trip_id = 1;
  optional string start_time = 2; // "HH:MM:SS"
  optional string start_date = 3; // "YYYYMMDD"

  enum ScheduleRelationship {
    SCHEDULED   = 0;
    ADDED       = 1;
    UNSCHEDULED = 2;
    CANCELED    = 3;
  }
  optional ScheduleRelationship schedule_relationship = 4;

  optional string route_id = 5;
  optional uint32 direction_id = 6; // 0 vagy 1
}

message VehicleDescriptor {
  optional string id = 1;            // belső azonosító
  optional string label = 2;         // felirat
  optional string license_plate = 3; // rendszám
}

// ---- TripUpdate (rövid, kompatibilitási célból) -----------------------------
// A projekted most nem használja a részleteit, de a mezőszámok kompatibilisek.

message TripUpdate {
  message StopTimeEvent {
    optional int32 delay = 1;
    optional int32 time = 2;
    optional int32 uncertainty = 3;
  }

  message StopTimeUpdate {
    optional uint32 stop_sequence = 1;
    optional string stop_id = 2;
    optional StopTimeEvent arrival = 3;
    optional StopTimeEvent departure = 4;

    enum ScheduleRelationship {
      SCHEDULED = 0;
      SKIPPED   = 1;
      NO_DATA   = 2;
    }
    optional ScheduleRelationship schedule_relationship = 5;
  }

  optional TripDescriptor trip = 1;
  repeated StopTimeUpdate stop_time_update = 2;
  optional VehicleDescriptor vehicle = 3;
  optional uint64 timestamp = 4;
  optional int32 delay = 5; // elavult, inkább StopTimeEvent
}

// ---- VehiclePosition (rövid, kompatibilitási célból) ------------------------

message VehiclePosition {
  enum VehicleStopStatus {
    INCOMING_AT = 0;
    STOPPED_AT  = 1;
    IN_TRANSIT_TO = 2;
  }

  enum CongestionLevel {
    UNKNOWN_CONGESTION_LEVEL = 0;
    RUNNING_SMOOTHLY = 1;
    STOP_AND_GO = 2;
    CONGESTION = 3;
    SEVERE_CONGESTION = 4;
  }

  enum OccupancyStatus {
    EMPTY = 0;
    MANY_SEATS_AVAILABLE = 1;
    FEW_SEATS_AVAILABLE = 2;
    STANDING_ROOM_ONLY = 3;
    CRUSHED_STANDING_ROOM_ONLY = 4;
    FULL = 5;
    NOT_ACCEPTING_PASSENGERS = 6;
    NO_DATA_AVAILABLE = 7;
    NOT_BOARDABLE = 8;
  }

  optional TripDescriptor trip = 1;
  optional Position position = 2;
  optional uint32 current_stop_sequence = 3;
  optional VehicleStopStatus current_status = 4 [default = IN_TRANSIT_TO];
  optional uint64 timestamp = 5;
  optional CongestionLevel congestion_level = 6;
  optional string stop_id = 7;
  optional VehicleDescriptor vehicle = 8;
  optional OccupancyStatus occupancy_status = 9;
}

// ---- ALERTS (ez kell a Dk2-nek) --------------------------------------------

message EntitySelector {
  optional string agency_id = 1;
  optional string route_id  = 2;
  optional int32  route_type = 3;   // ha a feed kitölti
  optional TripDescriptor trip = 4;
  optional string stop_id = 5;
}

message Alert {
  repeated TimeRange active_period = 1;
  repeated EntitySelector informed_entity = 5;

  enum Cause {
    UNKNOWN_CAUSE      = 1;
    OTHER_CAUSE        = 2;
    TECHNICAL_PROBLEM  = 3;
    STRIKE             = 4;
    DEMONSTRATION      = 5;
    ACCIDENT           = 6;
    HOLIDAY            = 7;
    WEATHER            = 8;
    MAINTENANCE        = 9;
    CONSTRUCTION       = 10;
    POLICE_ACTIVITY    = 11;
    MEDICAL_EMERGENCY  = 12;
  }
  optional Cause cause = 6;

  enum Effect {
    NO_SERVICE          = 1;
    REDUCED_SERVICE     = 2;
    SIGNIFICANT_DELAYS  = 3;
    DETOUR              = 4;
    ADDITIONAL_SERVICE  = 5;
    MODIFIED_SERVICE    = 6;
    OTHER_EFFECT        = 7;
    UNKNOWN_EFFECT      = 8;
    STOP_MOVED          = 9;
  }
  optional Effect effect = 7;

  optional TranslatedString url = 10;
  optional TranslatedString header_text = 8;
  optional TranslatedString description_text = 9;
}
